name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes pytest pytest-cov

      - name: Code Quality & Static Analysis (Pyflakes)
        run: |
          pyflakes backend tests api

      - name: Verify Frontend DOM IDs & Syntax
        run: |
          python tests/check_dom_ids.py

      - name: Run API Unit Tests
        env:
          PYTHONPATH: "."
          PYTHONUTF8: "1"
          ADMIN_SECRET_KEY: "12345"
        run: |
          python -m pytest tests/test_api_upload.py

      - name: Run Contract Extraction Tests
        env:
          PYTHONPATH: "."
          PYTHONUTF8: "1"
        run: |
          python tests/test_16_contracts.py

      - name: Start Server & Run End-to-End Verification
        env:
          PYTHONPATH: "."
          PYTHONUTF8: "1"
          ADMIN_SECRET_KEY: "12345"
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          python tests/comprehensive_e2e_verification.py
